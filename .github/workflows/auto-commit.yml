name: Auto Green Commit 🟩

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create Commit
        run: |
          git config user.name "Galang0304"
          git config user.email "andiariegalang0@gmail.com"
          
          mkdir -p logs
          echo "🟩 Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > logs/contribution.md
          echo "Activity: Daily contribution #$RANDOM" >> logs/contribution.md
          
          git add -A
          git diff --staged --quiet || git commit -m "🟩 Auto commit - $(date -u '+%Y-%m-%d')"
          git push
